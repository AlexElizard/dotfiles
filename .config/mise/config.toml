min_version = "2026.10.18"

## [Configuration] #####################################################################
[settings]
dotfiles.root = "~/.dotfiles"  # ~ = $HOME on Linux, %USERPROFILE% on Windows
dotfiles.default_mode = "copy"
lockfile = true

## [DevTools] ##########################################################################
[tools]
aube = "latest"
btop = "latest"
cliamp = "latest"
fastfetch = "latest"
fd = "latest"
fnox = "latest"
fzf = "latest"
herdr = "latest"
lazygit = "latest"
minikube = "latest"
ripgrep = "latest"
ruff = "latest"
skim = "latest"
superfile = "latest"
task = "latest"
usage = "latest"
uv = "latest"
werf = "2"
yazi = "latest"
zellij = "latest"
"pypi:copier" = "latest"
"pypi:sqlit-tui" = { version = "latest", extras = "clickhouse,postgres,mssql" }

## [Bootstrap] #########################################################################
[bootstrap.dnf.repos]
ghostty = { copr = "scottames/ghostty" }
nerd-fonts = { copr = "che/nerd-fonts" }

[bootstrap.packages]
## Fedora RPM
"dnf:fish" = "latest"
"dnf:fuse-libs" = "latest"
"dnf:ghostty" = "latest"
"dnf:git-credential-libsecret" = "latest"
"dnf:google-chrome-stable" = "latest"
"dnf:nerd-fonts" = "latest"
"dnf:nextcloud-client" = "latest"
"dnf:remmina" = "latest"
"dnf:steam" = "latest"
## Flathub
"flatpak:app.zen_browser.zen" = "latest"
"flatpak:be.alexandervanhee.gradia" = "latest"
"flatpak:com.mattermost.Desktop" = "latest"
"flatpak:com.mattjakeman.ExtensionManager" = "latest"
"flatpak:com.vysp3r.ProtonPlus" = "latest"
"flatpak:io.podman_desktop.PodmanDesktop" = "latest"
"flatpak:it.mijorus.gearlever" = "latest"
"flatpak:md.obsidian.Obsidian" = "latest"
"flatpak:org.onlyoffice.desktopeditors" = "latest"
"flatpak:org.telegram.desktop" = "latest"

[bootstrap.mise_shell_activate]
bashrc = "activate"
fish = "activate"

[bootstrap.hooks.post-packages]
run = """
if ! hash zed 2> /dev/null; then
    echo "Install zed editor"
    curl -f https://zed.dev/install.sh | sh
fi

# Disable auto suspend on login screen
# https://discussion.fedoraproject.org/t/gnome-suspends-after-15-minutes-of-user-inactivity-even-on-ac-power/79801
if [ ! -f "/etc/dconf/db/gdm.d/01-customize-suspend" ]; then
    sudo tee /etc/dconf/db/gdm.d/01-customize-suspend > /dev/null <<EOF
[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-timeout=0
sleep-inactive-battery-timeout=0
EOF

    sudo dconf update
fi
"""

[dotfiles]
"~/.config/fastfetch" = { mode = "copy" }
"~/.config/ghostty" = { mode = "copy" }
"~/.config/git" = { mode = "copy" }
"~/.config/mise" = { mode = "copy" }
"~/.config/ruff" = { mode = "copy" }
"~/.config/zed" = { mode = "copy" }
