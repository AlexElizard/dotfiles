services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 8025:8025 # Mailpit UI
      - 1025:1025 # Mailpit SMTP
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: /mailpit readyz
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
